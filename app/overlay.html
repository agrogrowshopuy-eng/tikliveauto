<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TIKLIVEauto · Overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: transparent; opacity: 0; transition: opacity .25s; }
  video.ver { opacity: 1; }
  #aviso { position: fixed; left: 8px; bottom: 8px; font: 600 12px system-ui, sans-serif; color: #e8f7ff; background: rgba(6,10,20,.75);
    border: 1px solid #22e5ff; border-radius: 8px; padding: 6px 9px; max-width: 80%; }
  #aviso.oculto { display: none; }
</style>
</head>
<body>
<video id="v" playsinline preload="auto"></video>
<div id="aviso">Conectando con TIKLIVEauto…</div>
<script>
// Overlay para PRISM Live (Widget → Web). Muestra las animaciones y hace sonar la voz del lector.
const SERVIDOR = 'wss://nube-production-3662.up.railway.app';
const HTTP = SERVIDOR.replace(/^ws/, 'http');
const sala = new URLSearchParams(location.search).get('sala') || '';
const v = document.getElementById('v');
const aviso = document.getElementById('aviso');
const decir = (t, ms) => { aviso.textContent = t; aviso.classList.remove('oculto'); clearTimeout(decir.t); if (ms) decir.t = setTimeout(() => aviso.classList.add('oculto'), ms); };

// ---- Animaciones: de a una ----
const videos = [];
let pasando = false;
async function siguienteVideo() {
  if (pasando || !videos.length) return;
  pasando = true;
  const { url, volumen } = videos.shift();
  v.src = url; v.volume = Math.max(0, Math.min(1, (volumen ?? 80) / 100)); v.muted = false;
  v.classList.add('ver');
  try { await v.play(); }
  catch { v.muted = true; try { await v.play(); decir('Toca la pantalla una vez para activar el sonido', 6000); } catch { terminar(); } }
  const tope = setTimeout(terminar, 30000);
  function terminar() { clearTimeout(tope); v.onended = v.onerror = null; v.classList.remove('ver'); v.removeAttribute('src'); v.load(); pasando = false; setTimeout(siguienteVideo, 150); }
  v.onended = terminar; v.onerror = terminar;
}

// ---- Voz del lector: de a una ----
const voces = [];
let hablando = null;
function siguienteVoz() {
  if (hablando || !voces.length) return;
  const { url, volumen } = voces.shift();
  const a = new Audio(HTTP + url);
  a.volume = Math.max(0, Math.min(1, (volumen ?? 80) / 100));
  hablando = a;
  const fin = () => { hablando = null; siguienteVoz(); };
  a.onended = fin; a.onerror = fin;
  a.play().catch(() => { decir('Toca la pantalla una vez para activar el sonido', 6000); fin(); });
}
document.addEventListener('pointerdown', () => { v.muted = false; aviso.classList.add('oculto'); });

// ---- Conexión ----
let espera = 1000;
function conectar() {
  if (!sala) return decir('Falta el código de sala: copiá el enlace desde la app de TIKLIVEauto.');
  const ws = new WebSocket(`${SERVIDOR}/ws?rol=overlay&sala=${encodeURIComponent(sala)}`);
  ws.onopen = () => { espera = 1000; };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.tipo === 'listo') decir('✅ TIKLIVEauto conectado', 4000);
    else if (m.tipo === 'video') { if (videos.length < 8) videos.push(m); siguienteVideo(); }
    else if (m.tipo === 'audio') { if (voces.length < 8) voces.push(m); siguienteVoz(); }
    else if (m.tipo === 'cortar') { videos.length = 0; voces.length = 0; v.pause(); v.dispatchEvent(new Event('ended')); if (hablando) { hablando.pause(); hablando = null; } }
    else if (m.tipo === 'error') decir(m.texto);
  };
  ws.onclose = () => { decir('Reconectando…'); setTimeout(conectar, espera); espera = Math.min(espera * 2, 15000); };
}
conectar();
</script>
</body>
</html>
